; -----------------------------------------------------------------------------
; Local PHP Overrides for Laravel Development
; -----------------------------------------------------------------------------
; ไฟล์นี้จะถูกโหลดหลัง php.ini หลัก (99-local.ini ทำให้เป็นค่าสุดท้าย)
; ใช้สำหรับ dev environment สามารถปรับค่าตามความเหมาะสม
; -----------------------------------------------------------------------------

; ขนาดไฟล์ upload สูงสุด (ต้องสอดคล้องกับ client_max_body_size ใน Nginx)
upload_max_filesize = 20M
post_max_size = 25M

; Memory limit สำหรับ Artisan / Queue / Reverb
memory_limit = 512M

; เวลาประมวลผลสูงสุด (วินาที)
max_execution_time = 60

; Error reporting สำหรับ dev (php.ini-development ก็เปิดอยู่แล้ว แต่ใส่ไว้ชัดเจน)
error_reporting = E_ALL
display_errors = On
display_startup_errors = On
log_errors = On

; Timezone มาตรฐานสำหรับ Laravel
date.timezone = Asia/Bangkok
